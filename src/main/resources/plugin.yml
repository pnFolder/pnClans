name: pnClans
version: '${version}'

main: ua.inventorytype.pnclans.BukkitPlugin
# Bukkit accepts minor versions here, not a patch version. See README for the 1.16.5 best-effort policy.
api-version: '1.16'
load: POSTWORLD
softdepend:
  - Vault
  - PlaceholderAPI
  - PlayerPoints

commands:
  clan:
    description: Main pnClans command
    usage: /clan [menu|stats|battle|admin]
    aliases: [c, clans]

permissions:
  pnclans.use:
    description: Base permission for clan commands
    default: true
  pnclans.admin:
    description: Administrative access to clan inspection, balances, MMR, members, quests, battles, save, and reload
    default: op
