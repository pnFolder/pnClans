name: Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Read pnLibrary version
        id: pnlibrary
        run: echo "version=$(sed -n 's/^val pnLibraryVersion = "\(.*\)"//p' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Checkout pnLibrary
        uses: actions/checkout@v4
        with:
          repository: pnFolder/pnLibrary
          ref: v${{ steps.pnlibrary.outputs.version }}
          path: pnLibrary

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Publish pnLibrary to Maven Local
        working-directory: pnLibrary
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon --no-build-cache

      - name: Build
        run: ./gradlew clean build -PjavaTarget=${{ matrix.java }} --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: pnClans-paper-java${{ matrix.java }}
          path: build/libs/pnClans-*-paper-mc1.21.11-java${{ matrix.java }}.jar
          if-no-files-found: error
