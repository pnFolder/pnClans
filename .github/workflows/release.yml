name: Release

on:
  push:
    branches: [ main ]
    paths:
      - 'RELEASE_*.md'

permissions:
  contents: read

jobs:
  build:
    name: Build Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release JAR
        run: ./gradlew clean shadowJar -PjavaTarget=${{ matrix.java }} --no-daemon

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: pnClans-release-paper-java${{ matrix.java }}
          path: build/libs/pnClans-*-paper-mc1.21.11-java${{ matrix.java }}.jar
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release JARs
        uses: actions/download-artifact@v4
        with:
          pattern: pnClans-release-paper-java*
          path: release-artifacts
          merge-multiple: true

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Unable to resolve project version from build.gradle.kts" >&2
            exit 1
          fi

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            STAGE="STABLE"
            PRERELEASE="false"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]; then
            STAGE="ALPHA"
            PRERELEASE="true"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]]; then
            STAGE="BETA"
            PRERELEASE="true"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            STAGE="RC"
            PRERELEASE="true"
          else
            echo "Unsupported release version '$VERSION'. Expected X.Y.Z, X.Y.Z-alpha.N, X.Y.Z-beta.N or X.Y.Z-rc.N" >&2
            exit 1
          fi

          NOTES="RELEASE_${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "Missing release notes file: $NOTES" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          TITLE="$(sed -n '1s/^# //p' "$NOTES")"
          if [[ ! "$TITLE" =~ ^${TAG}[[:space:]]—[[:space:]].+ ]]; then
            echo "Release title must start with '$TAG — '" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-artifacts/pnClans-${{ steps.metadata.outputs.version }}-paper-mc1.21.11-java21.jar"
          test -f "release-artifacts/pnClans-${{ steps.metadata.outputs.version }}-paper-mc1.21.11-java25.jar"

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.metadata.outputs.tag }}"
          PRERELEASE="${{ steps.metadata.outputs.prerelease }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing $TAG"
            gh release edit "$TAG" \
              --title "${{ steps.metadata.outputs.title }}" \
              --notes-file "${{ steps.metadata.outputs.notes }}" \
              --prerelease="$PRERELEASE"
            exit 0
          fi

          PRERELEASE_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          echo "Publishing $TAG as ${{ steps.metadata.outputs.stage }}"
          gh release create "$TAG" \
            "release-artifacts/pnClans-${{ steps.metadata.outputs.version }}-paper-mc1.21.11-java21.jar" \
            "release-artifacts/pnClans-${{ steps.metadata.outputs.version }}-paper-mc1.21.11-java25.jar" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.metadata.outputs.title }}" \
            --notes-file "${{ steps.metadata.outputs.notes }}" \
            "${PRERELEASE_ARGS[@]}"
